<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | BlackGarden Technologies</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" href="https://bgtech-blog-posts-bkend.s3.ap-south-2.amazonaws.com/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --clr-bg-overlay: rgba(24,29,56,0.75);
            --clr-brand: #007bff;
            --clr-heading: #181d38;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: 'Roboto', Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--clr-bg-overlay);
            z-index: -1;
        }
        header {
            width: 100%;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 2px 12px rgba(24,29,56,0.08);
            padding: 18px 0 10px 0;
            position: sticky;
            top: 0;
            z-index: 2;
            text-align: center;
        }
        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: var(--clr-brand);
            text-shadow: 1px 1px #fff;
        }
        .blog-header {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--clr-heading);
            text-shadow: 1px 1px #fff;
        }
        .home-button a {
            display: inline-block;
            margin-top: 8px;
            border: 1px solid var(--clr-brand);
            background: #fff;
            color: var(--clr-brand);
            border-radius: 4px;
            padding: 8px 18px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: background .2s, color .2s;
        }
        .home-button a:hover {
            background: var(--clr-brand);
            color: #fff;
        }
        .signup-container {
            max-width: 400px;
            width: 100%;
            margin: 40px auto 0 auto;
            padding: 32px 24px 24px 24px;
            background: rgba(255,255,255,0.97);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(24,29,56,0.10);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        .signup-container h2 {
            color: var(--clr-brand);
            font-size: 1.5rem;
            margin-bottom: 18px;
            font-weight: 700;
        }
        form {
            width: 100%;
            text-align: left;
        }
        label {
            font-weight: 500;
            color: var(--clr-heading);
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            margin: 6px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        input[type="submit"] {
            background: var(--clr-brand);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background .2s;
        }
        input[type="submit"]:hover {
            background: #0056b3;
        }
        .signup-container p {
            margin-top: 18px;
            color: var(--clr-heading);
        }
        .signup-container a {
            color: var(--clr-brand);
            text-decoration: none;
        }
        .signup-container a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
            margin-bottom: 12px;
        }
        footer {
            background: var(--clr-heading);
            color: #fff;
            text-align: center;
            padding: 1rem 0 .6rem 0;
            margin-top: 2rem;
            font-size: 1rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        footer a {
            color: #fff;
            margin: 0 .5rem;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .signup-container {
                padding: 16px 6px 12px 6px;
                margin: 16px 2px 0 2px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .blog-header {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>BlackGarden Technologies</h1>
            <div class="blog-header">Sign Up</div>
            <div class="home-button"><a href="/signin">Home</a></div>
        </div>
    </header>
    <div class="signup-container">
        <h2>Sign Up</h2>
        {% if error_message %}
            <div class="error-message">{{ error_message }}</div>
        {% endif %}
        <form action="/signup" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <input type="submit" value="Sign Up">
        </form>
        <p>Already have an account? <a href="/signin">Sign In</a></p>
    </div>
    <footer>
        &copy; 2025 BlackGarden Technologies. All rights reserved.
        <br>
        <a href="https://www.instagram.com/blackgarden.tech/" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/in/raja-saravanesh/" target="_blank">LinkedIn</a>
        <a href="https://wa.me/919003662636" target="_blank">WhatsApp</a>
    </footer>
</body>
</html>
